# Lo que se puede sumar al sistema durante la instalación.
#
# Un complemento es un conjunto de paquetes y servicios con un nombre que una
# persona entiende. Lo lee `complementos.rs` en tiempo de ejecución desde
# /usr/share/vasak-installer/complementos.toml — **no está compilado dentro del
# binario**, así que sumar un navegador o un driver es editar este archivo, sin
# recompilar el instalador ni rehacer la ISO.
#
# ## Campos
#
#   id           Identificador estable. Va en el plan de instalación y en las
#                claves de traducción; cambiarlo rompe las dos cosas.
#   categoria    `navegador` | `impresoras` | `drivers` | `extras`.
#   paquetes     Lo que se instala. Se suman a `packages` de archinstall.
#   servicios    Unidades de **sistema** que se habilitan. Las de usuario las
#                habilitan sus propios paquetes; `systemctl enable` sin `--user`
#                no las encuentra y la instalación fallaría.
#   icono        Nombre del tema de iconos. **Tiene que existir en su versión a
#                color** (`scalable/`, no `symbolic/`): los complementos se
#                dibujan con el icono de verdad, porque un navegador se reconoce
#                por su logo y en glifo monocromo Firefox, Chromium y Brave son
#                tres contornos idénticos. Pedir a color un nombre que sólo
#                existe en simbólico **no falla**: devuelve `image-missing`, el
#                icono de imagen rota. Hay un test que lo verifica.
#   detectar     Opcional. Si está, el complemento se propone marcado cuando el
#                hardware coincide. Ver `hardware.rs`.
#   exclusivo    Opcional. Los de una misma categoría con `exclusivo = true` son
#                un grupo de los que se elige uno solo (el navegador).
#   por_defecto  Opcional. Viene marcado de entrada.
#
# ## Reglas
#
# **Nada acá está pre-marcado por conveniencia nuestra.** Lo que viene marcado
# es lo que la enorme mayoría necesita y desmarcar es barato; lo demás va
# apagado. Un instalador que deja diez cosas marcadas «porque total» instala un
# sistema que nadie eligió.
#
# **Ningún complemento puede ser necesario para arrancar.** Lo que hace falta
# para que el sistema encienda va en `vasakos-desktop`. Acá va lo opcional, y
# eso es lo que permite que un fallo instalando uno no sea fatal.

# ── Navegador ───────────────────────────────────────────────────────────────
#
# Exclusivos entre sí: se elige uno. Firefox viene marcado porque es el que trae
# la ISO y el que la gente encuentra si no elige nada.

[[complemento]]
id = "firefox"
categoria = "navegador"
paquetes = ["firefox"]
icono = "firefox"
exclusivo = true
por_defecto = true

[[complemento]]
id = "chromium"
categoria = "navegador"
paquetes = ["chromium"]
icono = "chromium"
exclusivo = true

[[complemento]]
id = "brave"
categoria = "navegador"
# Está en el repositorio de VasakOS, que ya queda configurado antes de instalar
# los paquetes del escritorio.
paquetes = ["brave-bin"]
icono = "brave-browser"
exclusivo = true

[[complemento]]
id = "sin-navegador"
categoria = "navegador"
paquetes = []
icono = "action-unavailable"
exclusivo = true

# ── Impresoras ──────────────────────────────────────────────────────────────
#
# No hace falta detectar nada: es una pregunta. Una impresora de red aparece
# recién cuando se la enchufa, y una USB puede no estar conectada al instalar.

[[complemento]]
id = "impresoras"
categoria = "impresoras"
paquetes = [
    "cups",
    "cups-pdf",
    "cups-filters",
    # Los controladores libres que cubren la mayoría de las impresoras.
    "gutenprint",
    "foomatic-db-engine",
    "foomatic-db",
    "foomatic-db-ppds",
    # HP, que es la marca con más modelos que necesitan su propio controlador.
    "hplip",
    # Descubrimiento de impresoras de red sin configurar nada.
    "nss-mdns",
    "avahi",
    # El diálogo de impresión de GTK.
    "system-config-printer",
]
# `cups.socket` y no `cups.service`: activación por socket, así que el daemon
# arranca la primera vez que algo quiere imprimir en vez de estar corriendo
# siempre. En un equipo que imprime dos veces por mes, eso es un servicio menos
# en cada arranque.
servicios = ["cups.socket", "avahi-daemon"]
icono = "printer"

# ── Escaneo ─────────────────────────────────────────────────────────────────

[[complemento]]
id = "escaner"
categoria = "impresoras"
paquetes = ["sane", "sane-airscan", "simple-scan"]
icono = "scanner"

# ── Drivers de video ────────────────────────────────────────────────────────
#
# `detectar` los propone marcados cuando el hardware está. Se **proponen**, no
# se imponen: el driver propietario de NVIDIA es una decisión con consecuencias
# —no anda con Wayland en todas las tarjetas, y complica los kernels
# alternativos— así que se explica y se deja elegir.
#
# Los controladores libres de AMD e Intel ya vienen en `vasakos-desktop` vía
# mesa: acá va **sólo lo que se suma**, y eso es literal. Un paquete que el
# metapaquete ya arrastra no puede estar también acá: la casilla se dibujaría,
# el usuario la desmarcaría, y el paquete se instalaría igual por dependencia.
# `build-all.sh` avisa cuando las dos listas se pisan.

[[complemento]]
id = "nvidia-propietario"
categoria = "drivers"
paquetes = ["nvidia-dkms", "nvidia-utils", "lib32-nvidia-utils", "nvidia-settings"]
icono = "preferences-desktop-display"
detectar = "gpu-nvidia"

[[complemento]]
id = "nvidia-libre"
categoria = "drivers"
# `nouveau` como módulo del kernel ya viene con `linux`, y `mesa` con el
# metapaquete: lo único que falta para una NVIDIA con el driver libre es su
# Vulkan. Antes acá decía `xf86-video-nouveau`, que es el driver de **Xorg** y
# en un escritorio Wayland no lo usa nadie.
paquetes = ["vulkan-nouveau"]
icono = "preferences-desktop-display"
detectar = "gpu-nvidia"

[[complemento]]
id = "amd-vulkan"
categoria = "drivers"
paquetes = ["vulkan-radeon", "lib32-vulkan-radeon"]
icono = "preferences-desktop-display"
detectar = "gpu-amd"

[[complemento]]
id = "intel-vulkan"
categoria = "drivers"
paquetes = ["vulkan-intel", "lib32-vulkan-intel"]
icono = "preferences-desktop-display"
detectar = "gpu-intel"

[[complemento]]
id = "broadcom-wifi"
categoria = "drivers"
paquetes = ["broadcom-wl-dkms"]
icono = "network-wireless"
detectar = "wifi-broadcom"

# ── Extras ──────────────────────────────────────────────────────────────────

[[complemento]]
# Los 299 MiB de fuentes de chino, japonés y coreano. Estuvieron en
# `vasakos-desktop`, donde eran el paquete más grande de todo el escritorio —más
# que todos los controladores juntos— y los cargaba también quien nunca va a ver
# un carácter CJK.
#
# Sin ellas, ese texto se dibuja con cuadraditos; con ellas, cada instalación
# paga 299 MiB por si acaso. Como complemento, lo paga quien lo necesita. No
# viene marcado: la configuración por defecto del escritorio nombra Noto Sans y
# las nerd fonts, no éstas.
id = "fuentes-cjk"
categoria = "extras"
paquetes = ["noto-fonts-cjk"]
icono = "preferences-desktop-font"

[[complemento]]
id = "ofimatica"
categoria = "extras"
paquetes = ["libreoffice-fresh", "hunspell", "hunspell-es_ar", "hunspell-en_us"]
icono = "applications-office"

[[complemento]]
id = "desarrollo"
categoria = "extras"
# `git` estuvo un rato en ninguna lista: salió de acá cuando `vasakos-desktop` lo
# arrastraba —la casilla no cambiaba nada— y después salió del metapaquete, que
# es donde no corresponde: es una herramienta de desarrollo, no parte del
# escritorio. Acá sí, que es donde se elige.
paquetes = ["base-devel", "git", "code"]
icono = "applications-development"

[[complemento]]
id = "juegos"
categoria = "extras"
paquetes = ["steam", "lutris", "wine", "gamemode", "lib32-gamemode"]
icono = "applications-games"
