_version: 1
# Los textos del instalador.
#
# Dos reglas, las dos con test en `tests/locales.rs`:
#
#  1. **Si el valor contiene `: `, va entre comillas.** Sin ellas el parser lo lee
#     como un mapeo anidado, rompe el archivo entero y el plugin **paniquea al
#     arrancar**: la aplicación no abre.
#  2. Los dos idiomas tienen las **mismas claves** y los mismos marcadores `{0}`.
#
# `t()` no interpola: el marcador se reemplaza con `interpolar()` de
# `src/tools/interpolar.ts`. Nunca con `String.replace` a mano — interpreta `$&`
# y `$'` en el reemplazo, y un dato con esos caracteres se pierde.
app:
  nombre: Instalar VasakOS
ventana:
  minimizar: Minimizar
  maximizar: Maximizar
  cerrar: Cerrar

