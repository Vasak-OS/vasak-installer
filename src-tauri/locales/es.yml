  atras: Atrás
  cancelar: Cancelar
  reintentar: Reintentar
  cerrar: Cerrar
  aceptar: Aceptar
  cargando: Cargando…
  ninguno: Ninguno
  si: Sí
  no: "No"
  buscar: Buscar
  sinResultados: No hay resultados
  requerido: Obligatorio
  opcional: Opcional
  mostrarDetalles: Ver detalles
  ocultarDetalles: Ocultar detalles
  copiar: Copiar
  copiado: Copiado

