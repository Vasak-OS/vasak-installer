_version: 1
# The installer's user-facing text.
#
# Two rules, both covered by `tests/locales.rs`:
#
#  1. **A value containing `: ` must be quoted.** Without the quotes the parser
#     reads it as a nested mapping, breaks the whole file, and the plugin
#     **panics on startup**: the application never opens.
#  2. Both languages carry the same keys and the same `{0}` placeholders.
#
# `t()` does not interpolate: the placeholder is replaced with `interpolar()`
# from `src/tools/interpolar.ts` — never with a bare `String.replace`, which
# interprets `$&` and `$'` in the replacement and silently drops data.
app:
  nombre: Install VasakOS
ventana:
  minimizar: Minimise
  maximizar: Maximise
  cerrar: Close

comun:
  siguiente: Continue
  atras: Back
  cancelar: Cancel
  reintentar: Try again
  cerrar: Close
  aceptar: OK
  cargando: Loading…
  ninguno: None
  si: "Yes"
  no: "No"
  buscar: Search
  sinResultados: No results
  requerido: Required
  opcional: Optional
  mostrarDetalles: Show details
  ocultarDetalles: Hide details
  copiar: Copy
  copiado: Copied

pasos:
  bienvenida:
    titulo: Welcome
    descripcion: Before we start
  red:
    titulo: Network
    descripcion: Internet connection
  region:
    titulo: Region
    descripcion: Language and time zone
  teclado:
    titulo: Keyboard
    descripcion: Keyboard layout
  disco:
    titulo: Disk
    descripcion: Where it gets installed
  cuenta:
