[package]
name = "vasak-installer"
version = "0.1.5"
description = "Instalador de VasakOS"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"
# Cuál de los dos binarios corre `cargo run`.
#
# Sin esto, `cargo run` se planta con «could not determine which binary to run»
# en cuanto el paquete tiene más de un `[[bin]]` — y `tauri dev` es exactamente
# un `cargo run`, así que la aplicación no se podía desarrollar. `tauri build` no
# lo notaba porque compila los dos y el empaquetador elige por `productName`:
# el fallo aparecía sólo al querer trabajar sobre la interfaz.
default-run = "vasak-installer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dos binarios, y la separación es la decisión de seguridad central de esta
# aplicación: la ventana es un WebView completo y corre como el usuario de la
# sesión; el ayudante es un programa de un solo archivo y es el único que corre
# como root. Ver `helper.rs`.
#
# El empaquetador de Tauri sólo empaqueta el primero; el PKGBUILD instala el
# segundo a mano en /usr/lib/vasak-installer/.
[[bin]]
name = "vasak-installer"
path = "src/main.rs"

[[bin]]
name = "vasak-installer-helper"
path = "src/helper_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Los plugins del escritorio. Los cuatro, no dos: una app de VasakOS tiene que
# hablar el idioma de la sesión y abrir el menú del sistema con el clic derecho.
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2"
tauri-plugin-i18n-vsk = "2.1.1"
tauri-plugin-vsk-contextual-menu = "2"
tauri-plugin-shell = "2"

# Para la ventana sin decoración: la barra propia necesita mover y redimensionar.
gtk = "0.18"
tauri-plugin-vsk-journal = "2"

# Sólo por `getuid()` en el ayudante, para negarse a arrancar sin privilegios con
# un mensaje que se entienda en vez de fallar después en el primer `mkfs`.
libc = "0.2"

# El catálogo de complementos (navegador, controladores, impresoras) es un TOML
# que se lee en tiempo de ejecución: sumar un navegador tiene que ser editar un
# archivo de datos, no recompilar el instalador ni rehacer la ISO.
toml = "0.8"

[dev-dependencies]
# Árboles de `/sys` de mentira para probar la detección de hardware: no hay forma
# de tener una NVIDIA y una AMD en la misma máquina de pruebas, y el código que
# elige qué controlador proponer es justamente el que no puede estar sin probar.
tempfile = "3"
# Sólo para el test que valida los catálogos de idioma: el plugin los parsea en
# tiempo de ejecución y **paniquea** si no puede, así que un error de sintaxis no
# se ve hasta que la aplicación no arranca.
serde_yaml = "0.9"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Deja que LLVM optimice mirando todo el programa a la vez.
lto = "thin"       # ~90% del beneficio de fat LTO, compilando mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Sin desenrollado de pila: binario más chico y más rápido.
strip = true       # Fuera los símbolos de depuración.

# Ojo al empaquetar: makepkg inyecta `-flto` global en CFLAGS/LDFLAGS, y los
# crates que compilan C o assembly (ring, vía rustls) emiten bitcode que el
# enlazador de rustc no resuelve. El PKGBUILD tiene que llevar `options=('!lto')`
# — Cargo ya hace su propio LTO acá arriba, así que el de makepkg es redundante
# además de dañino.
